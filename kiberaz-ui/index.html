<!doctype html>
<html lang="az">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Meta Tags -->
  <title>Azərbaycan kiber təhlükəsizlik təlimləri</title>
  <meta name="description"
    content="Kiberaz.az — Azərbaycanda aparıcı kibertəhlükəsizlik platforması. Təlimlər, sertifikat hazırlığı (eJPT, eWPT, eWPTX), müsahibə sualları, imtahan sessiyaları və liderlik lövhəsi." />
  <meta name="keywords"
    content="kibertəhlükəsizlik, pentesting, eJPT, eWPT, network security, web security, SOC, Active Directory, Azərbaycan" />
  <meta name="author" content="Kiberaz.az" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kiberaz.az/" />
  <meta property="og:title" content="Kiberaz.az — Kibertəhlükəsizlik Təhsil Platforması" />
  <meta property="og:description"
    content="Azərbaycanda aparıcı kibertəhlükəsizlik platforması. Təlimlər, sertifikat hazırlığı, müsahibə sualları və daha çox." />
  <meta property="og:locale" content="az_AZ" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kiberaz.az — Kibertəhlükəsizlik Platforması" />
  <meta name="twitter:description" content="Azərbaycanda aparıcı kibertəhlükəsizlik təhsil platforması." />

  <!-- Brauzer xrom rəngi — aktiv mövzuya görə (useTheme yeniləyir) -->
  <meta name="theme-color" content="#060C14" />

  <!-- Content-Security-Policy — XSS-in əsas müdafiə qatı. SPA API-dən ayrı hostda yerləşdiyi
       üçün başlıq burada, meta ilə verilir (statik host əlavə olaraq eyni siyasəti HTTP başlığı
       kimi də göndərməlidir — meta `frame-ancestors`-u dəstəkləmir).
       %API_ORIGIN%, %CSP_DEV% (yalnız dev: Vite/HMR inline skripti üçün nonce) və %CSP_UPGRADE%
       dəyərlərini vite.config.ts doldurur. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' %CSP_DEV% https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; style-src-elem 'self' %CSP_STYLE_DEV%; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: %API_ORIGIN%; connect-src 'self' %API_ORIGIN% https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; %CSP_UPGRADE%" />

  <!-- Mövzu ilk boyamadan ƏVVƏL tətbiq olunur (public/theme-init.js) — CSP inline skriptə icazə vermir. -->
  <script src="/theme-init.js"></script>

  <!-- Şriftlər (Inter, JetBrains Mono) src/fonts.ts ilə özümüzdən verilir — kənar Google Fonts sorğusu yoxdur. -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
