<head>

  <!-- SEO Meta Tags -->
  <title>Azərbaycan kiber təhlükəsizlik təlimləri</title>
  <meta name="description"
    content="Kiberaz.az — Azərbaycanda aparıcı kibertəhlükəsizlik platforması. Təlimlər, sertifikat hazırlığı (eJPT, eWPT, eWPTX), müsahibə sualları, imtahan sessiyaları və liderlik lövhəsi." />
  <meta name="keywords"
    content="kibertəhlükəsizlik, pentesting, eJPT, eWPT, network security, web security, SOC, Active Directory, Azərbaycan" />
  <meta name="author" content="Kiberaz.az" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kiberaz.az/" />
  <meta property="og:title" content="Kiberaz.az — Kibertəhlükəsizlik Təhsil Platforması" />
  <meta property="og:description"
    content="Azərbaycanda aparıcı kibertəhlükəsizlik platforması. Təlimlər, sertifikat hazırlığı, müsahibə sualları və daha çox." />
  <meta property="og:locale" content="az_AZ" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kiberaz.az — Kibertəhlükəsizlik Platforması" />
  <meta name="twitter:description" content="Azərbaycanda aparıcı kibertəhlükəsizlik təhsil platforması." />

  <!-- Brauzer xrom rəngi — aktiv mövzuya görə (useTheme yeniləyir) -->
  <meta name="theme-color" content="#FAFBFC" />

  <!-- Mövzu ilk boyamadan ƏVVƏL tətbiq olunur ki, səhv mövzu "işartısı" olmasın.
       Yalnız mövzu seçimi localStorage-da saxlanılır; heç bir token/sessiya məlumatı burada yoxdur. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('kiberaz-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Şriftlər: Inter (əsas) + JetBrains Mono (texniki məzmun). Hər ikisi Azərbaycan hərflərini tam dəstəkləyir. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>

</body>
